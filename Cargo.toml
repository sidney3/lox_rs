[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
proc-macro2 = { version = "1.0.74" }
quote = { version = "1.0.35" }
syn = { version = "2.0.81" }

[package]
name = "lox_rs"
version = "0.1.0"
edition = "2024"


[dependencies]
smallvec = "1"
itertools = "0.12"
bitvec = "1"
lasso = "0.7.3"
ndarray = "0.17"
either = "1"
nonempty = "0.10"
thiserror = "2"
strum = { version = "0.28.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.33"
env_logger = "0.11.11"
annotate-snippets = "0.12.16"

lox_derive = { path = "crates/lox_derive" }
lox_core = { path = "crates/lox_core" }

[features]
stress_test_gc = []


[lints.rust]
warnings = "deny"
